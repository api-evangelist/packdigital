description: >-
  Official remote MCP server that connects AI assistants to Pack to search,
  edit, preview, publish, schedule, and A/B test Shopify Hydrogen storefront
  content. Backed by the Pack GraphQL Content Management API.
# Tool families as documented (individual tool names not all published verbatim).
tool_families:
  - name: content-management
    description: Read, list, update, publish, and unpublish pages, product pages, collection pages, blogs, articles, templates, sections, and site settings.
  - name: search-and-history
    description: Search content, inspect revisions, review references, and compare draft changes.
  - name: environments
    description: Inspect content environments, target a specific environment, and manage locale-aware content.
  - name: preview-urls
    description: List, create, update, and delete preview URLs.
  - name: scheduling
    description: Inspect and manage scheduled content.
  - name: product-data
    description: Search and read product catalog data and trigger product synchronization.
  - name: ab-testing
    description: List tests, update tests and variants, manage test lifecycle (start, pause, end, delete), and retrieve saved goal metrics.
limitations:
  - Some admin-only workflows are not yet available (media-manager uploads, A/B goal creation or deletion).
