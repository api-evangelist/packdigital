name: Packdigital
description: >-
  Pack Digital is a digital experience platform purpose-built for Shopify Hydrogen that lets
  AI agents and human teams collaborate on headless storefronts: agents draft changes, the team
  reviews them in content releases, and you ship when ready. Pack pairs a visual Customizer,
  server-side A/B testing, media and localization, and the open-source Blueprint Hydrogen theme
  with a developer surface — a GraphQL Content Management API, JavaScript SDKs (@pack/client,
  @pack/react, @pack/hydrogen, @pack/types), and an official hosted MCP server for agent-native
  content editing, publishing, scheduling, and testing. Backed by Norwest Venture Partners.
